[project]
name = "ae-mcp-server"
version = "1.0.0"
description = "After Effects MCP server - lets AI agents drive Adobe After Effects through a resident ExtendScript bridge"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.9",
    "anyio>=4.0",
    "starlette>=0.36",
    "uvicorn>=0.27",
]

[project.scripts]
ae-mcp = "ae_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ae_mcp"]
